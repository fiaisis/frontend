---
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      action-packages:
        patterns:
          - '*'

  # Maintain dependencies for yarn
  - package-ecosystem: 'npm' # npm is correct even for yarn, see: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#package-ecosystem
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      JS-packages:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*react*'
      # Upgrade the H5Web packages and source submodule together after viewer validation.
      - dependency-name: '@h5web/*'
      # The bundled H5Web zoom implementation requires camera scaling, removed in r183.
      - dependency-name: 'three'
        versions: ['>=0.183.0']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      docker-packages:
        patterns:
          - '*'
